# MistyMoon RP Host v1. The host plane owns DSH runtime, Web providers,
# MistyMoon Foundation/Memory, and the qualified Flash Work provider. This standing
# preset contributes only the RP-specific Persona slot and model-facing tools.

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 60000
    fetchTimeoutMs: 60000

- id: mistymoon-code-flash
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: mistymoon-work-flash
    toolName: mistymoon_code_flash
    enableRunInBackground: false
    backgroundMode: one-shot
    maxDepth: provider-managed

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Enforce the exact RP Host catalog after the parallel loader rows above have
# registered. The composition also installs an execution guard for tools that
# may appear later through HMR or another host contribution.
- id: mistymoon-rp-host-composition
  name: '@mistymoon/dsh/foundation/rp-host'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
