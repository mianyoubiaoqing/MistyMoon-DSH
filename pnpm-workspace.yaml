packages:
  - packages/*

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false

minimumReleaseAgeExclude:
  # DSH publishes one synchronized package family; this repository verifies the
  # selected tag/commit and built package artifacts in its compatibility tests.
  - '@deepseek-ai/*'
