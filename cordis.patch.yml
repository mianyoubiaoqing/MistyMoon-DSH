- insert:
    - id: mistymoon-identity
      name: '@mistymoon/dsh/identity'
      config:
        ownerId: local-owner

    - id: mistymoon-foundation
      name: '@mistymoon/dsh/foundation'
      config:
        home: !!js dshHomePath('mistymoon')
        defaultRoleplayMode: companion

    - id: mistymoon-settings-ui
      name: '@mistymoon/dsh'
      config:
        home: !!js dshHomePath('mistymoon')

    - id: mistymoon-memory
      name: '@mistymoon/dsh/memory'
      config:
        path: !!js dshHomePath('mistymoon', 'memory', 'memories.jsonl')
        recallLimit: 8
        settingsPath: !!js dshHomePath('mistymoon', 'settings', 'settings.json')
        leaseTimeoutMs: 30000
        leaseStaleMs: 120000
        disposeTimeoutMs: 5000
        maxArchiveBytes: 67108864
        maxTransactionBytes: 1048576
        channelDisclosure: owner-confidential

    - id: mistymoon-work-agent-runtime
      name: '@mistymoon/dsh/work-agent-dsh'
      config:
        settingsPath: !!js dshHomePath('mistymoon', 'settings', 'work-model.json')
